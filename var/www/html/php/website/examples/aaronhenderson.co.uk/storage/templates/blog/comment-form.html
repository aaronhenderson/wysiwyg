<form method="post"
      action="?action=submit-comment&post_id=<!-- post_id -->">

    <div class="form-group">
        <textarea class="form-control"
                  placeholder="Enter a comment"
                  name="inputCommentBody"></textarea>
    </div>

    <div class="form-group">
        <input type="hidden"
               id="inputPostID"
               name="inputPostID"
               value="<!-- post_id -->"/>

        <button type="submit"
                class="btn btn-primary btn-block">
            Post comment
        </button>
    </div>
</form>
