<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Facebook.com - The Creative-Commons Alternative</title>
    <style>
        html { background-color: #eee; padding: 6px; }
        body { font-family: Helvetica; background-color: #fff; padding: 12px; }

        body > header { content: ""; position: relative; }
        body > header { padding-left: 24px; padding-right: 24px; padding-top: 24px; }
        body > header { background-color: #0866ff; color: #fff; margin-bottom: 12px }

        body > header > ul { list-style-type: none; margin: -48px 0 0 0; padding: 0; float: right; }
        body > header > ul > li { padding: 0; text-align: right; display: inline-block; }
        body > header > ul > li > a { font-size: smaller; background-color: #0866ff; color: #fff; padding: 4px; }
        body > header > ul > li > a { font-weight: bold; }
        body > header > ul > li > a:hover { text-decoration: none; }

        body > article { margin-bottom: 48px; font-size: smaller }

        body > article > h2, body > article > h3, body > article > h4 , body > article > h5 , body > article > h6 ,
        body > article > p , body > .footer > p ,
        .form-row { padding: 6px 24px; }

        body > article > h2, body > article > h3, body > article > h4 , body > article > h5 , body > article > h6 {
            margin-bottom: 0; padding-bottom: 12px;
        }

        body > article > p ,
        .form-row { margin: 0; }

        .alerting { font-size: smaller; color: #aa7700; font-weight: bold; }
        .alerting { margin: 0 24px 12px; padding: 0;}

        body .form-row label:after { content: ": "; }
        body .form-row label { min-width: 170px; display: inline-block; font-size: smaller }
        body .form-row input { padding: 6px; min-width: 190px; }
        body .form-row input.input-wider { padding: 6px; min-width: 240px; }
        body .form-row hr { max-height: 1px; border-bottom: 0; }
        body .form-row button[type="submit"] { padding: 12px 24px; background-color: #2ECC40; color: #fff; border: 0px; }

        body > .footer { border-top: solid 1px #ccc; margin: 48px 24px 0; padding-top: 12px }
        body > .footer > p.small-text { padding: 0; font-size: smaller; }
        body .form-row p { font-size: smaller; }

        @media screen and (min-width: 968px){
            .desktop-float-right { float: right }
            .desktop-float-left  { float: left }
        }

        form[action="?user_search"] { background-color: #fff; margin: -60px 248px 12px 288px; }
        form[action="?user_search"] { position: relative; z-index: 9; padding: 6px 6px; box-sizing: content-box }
        form[action="?user_search"] input { border-radius: 0; padding: 6px; width: 100%; box-sizing: border-box }
        form[action="?user_search"] input { margin-right: 220px; border: solid 1px #ccc }
        form[action="?user_search"] button {}

        aside:first-of-type { float: left; }
        aside > nav > ul { list-style-type: none; padding: 0; margin: 0 24px 48px; }
        aside > nav > ul li { padding: 0; margin: 6px 0;}
        aside > nav > ul li a { padding: 6px 0; font-size: smaller }
        footer { clear: both; }

    </style>
</head>
<body>
    <header id="application__header">
        <h1 ondblclick="window.location = '/php/website/examples/facebook.com/'">facebook</h1>

        <ul>
            <li>
                <a href="?user_profile">{ user.name }</a>
            </li>
            <li>
                <a href="?sign_out">{ en.signout } </a>
            </li>
        </ul>
    </header>
    <form method="post" action="?user_search">
        <input type="text" name="input__user_search" id="input__user_search" placeholder="Search..">
    </form>



<footer class="footer">
        <p class="small-text desktop-float-right">
            <a href="/php/website/examples/facebook.com/?terms_of_service">{ user.terms }</a> -
            <a href="/php/website/examples/facebook.com/?privacy_statement">{ user.privacy }</a>
        </p>
        <p class="small-text">
            <a href="?user_profile">{ user.profile }</a>,
            <a href="?user_settings">{ user.settings }</a>,
            <a href="?user_messages">{ user.messages }</a>,
            <a href="?user_search">{ user.search }</a>
        </p>
    </footer>
</body>
</html>
